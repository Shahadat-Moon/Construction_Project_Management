<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  /* Compact list tweaks for expense page */
  .expense-card { border-radius: 12px; box-shadow: 0 8px 20px rgba(2,6,23,0.06); }
  .expense-header { background: linear-gradient(90deg,#7c3aed 0%, #a78bfa 100%); }
  .expense-date { width: 72px; min-width:72px; }
  .expense-type { min-width:120px; }
  .notes-col { color: #64748b; }
  @media (min-width:640px){ .expense-row { font-size:0.92rem; } }
  /* keep notes visible on mobile for parity with desktop */
</style>
</head>

<body class="bg-slate-100 min-h-screen pb-28 text-sm">

<!-- HEADER -->
<header class="bg-white shadow sticky top-0 z-10">
  <div class="px-4 py-3 grid grid-cols-3 items-center">
    <button onclick="history.back()" class="text-blue-600 text-sm text-left">
      Back
    </button>

    <h1 class="text-lg font-semibold text-center">Expenses</h1>

    <div class="flex justify-end">
      <img src="logo.jpg" class="h-8" alt="Company Logo">
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="p-4 max-w-3xl mx-auto space-y-6">

  <div id="expenseContainer" class="space-y-4"></div>

  <p id="emptyState" class="hidden text-center text-gray-500 mt-16">
    No expense data for the last 30 days
  </p>

</main>

<!-- ADD BUTTON -->
<a href="expense-add.html"
  class="fixed bottom-24 right-4 bg-purple-600 text-white w-16 h-16 rounded-full flex items-center justify-center shadow-lg text-3xl hover:bg-purple-700 transition">
  +
</a>

<!-- BOTTOM NAV -->
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t shadow">
  <div class="grid grid-cols-5 text-xs text-gray-600">
    <a href="index.html" class="py-3 flex flex-col items-center">🏠<span>Home</span></a>
    <a href="income.html" class="py-3 flex flex-col items-center">💰<span>Income</span></a>
    <a href="expense.html" class="py-3 flex flex-col items-center text-purple-600 font-medium">💸<span>Expense</span></a>
    <a href="projects.html" class="py-3 flex flex-col items-center">🏗️<span>Project</span></a>
    <a href="reports.html" class="py-3 flex flex-col items-center">📊<span>Report</span></a>
  </div>
</nav>

<!-- SCRIPT -->
<script>
  const supabase = window.supabase.createClient(
    'https://sbqyxvxpeqipcuavryhb.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNicXl4dnhwZXFpcGN1YXZyeWhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxNTk0NjcsImV4cCI6MjA4NDczNTQ2N30.XWbqg5fwC3TDFt-G79H-SGg-9WMdV08qkZ6OzdPK8f8'
  )

  function last30DaysDate() {
    const d = new Date()
    d.setDate(d.getDate() - 30)
    return d.toISOString().split('T')[0]
  }

  async function loadExpenses() {

    // Fetch expenses (last 30 days, latest first)
    const { data: expenses, error } = await supabase
      .from('expense')
      .select('*')
      .gte('date', last30DaysDate())
      .order('date', { ascending: false })

    if (error) {
      console.error(error)
      return
    }

    const container = document.getElementById('expenseContainer')
    const empty = document.getElementById('emptyState')
    container.innerHTML = ''

    if (!expenses || expenses.length === 0) {
      empty.classList.remove('hidden')
      return
    }

    // Fetch project names
    const projectIds = [...new Set(expenses.map(e => e.project_id))]
    const { data: projects } = await supabase
      .from('projects')
      .select('id, name')
      .in('id', projectIds)

    const projectMap = {}
    projects?.forEach(p => projectMap[p.id] = p.name)

    // Group expenses by project
    const grouped = {}
    expenses.forEach(e => {
      if (!grouped[e.project_id]) grouped[e.project_id] = []
      grouped[e.project_id].push(e)
    })

    Object.keys(grouped).forEach(projectId => {
      const card = document.createElement('div')
      card.className = 'bg-white rounded-2xl shadow overflow-hidden'

      const rows = grouped[projectId].map(e => `
        <div class="expense-row flex items-center justify-between py-2 px-3">
          <div class="flex items-center gap-3">
            <div class="expense-date text-xs text-slate-700 font-semibold">${new Date(e.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>
            <div class="expense-type text-slate-800 font-medium">${e.type}</div>
            <div class="notes-col text-xs ml-2">${e.notes || '-'}</div>
          </div>
          <div class="text-right">
            <div class="text-sm font-semibold text-red-600">৳ ${Number(e.amount).toLocaleString()}</div>
          </div>
        </div>
      `).join('')

      card.innerHTML = `
        <div class="expense-header text-white px-4 py-3">
          <p class="font-semibold">${projectMap[projectId] || projectId}</p>
          <p class="text-xs opacity-90">Project ID: ${projectId}</p>
        </div>

        <div class="p-3 bg-white">
          <div class="space-y-0.5">
            ${rows}
          </div>
        </div>
      `

      container.appendChild(card)
    })
  }

  loadExpenses()
</script>

</body>
</html>
