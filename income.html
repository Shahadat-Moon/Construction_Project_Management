<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Income</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  /* Income page compact styling (green palette) */
  .income-card { border-radius: 12px; box-shadow: 0 8px 20px rgba(2,6,23,0.06); overflow:hidden; }
  .income-header { background: linear-gradient(90deg,#10b981 0%, #34d399 100%); }
  .income-row { display:flex; align-items:center; justify-content:space-between; gap:0.75rem; padding:0.5rem 0.75rem; cursor:pointer; }
  .income-date { width:85px; min-width:85px; font-weight:600; }
  .income-meta { min-width:120px; font-weight:500; color:#0f172a; }
  .income-amount { text-align:left; font-weight:700; color:#065f46; }
  .income-sub { font-size:0.8rem; color:#475569; }
  /* hide income-sub on small screens; reveal when row has .show-details */
  @media (max-width:640px){ .income-sub { display:none; } .income-row.show-details .income-sub { display:block; } }
  .chev { display:inline-block; transition:transform .18s ease; color:#94a3b8; margin-left:0.5rem }
  .income-row.show-details .chev { transform:rotate(180deg); color:#065f46 }
</style>
</head>

<body class="bg-slate-100 min-h-screen pb-24 text-sm">

<!-- HEADER -->
<header class="bg-white shadow sticky top-0 z-10">
  <div class="px-4 py-3 grid grid-cols-3 items-center">
    <button onclick="history.back()" class="text-blue-600 text-sm text-left">Back</button>
    <h1 class="text-lg font-semibold text-center">Income</h1>
    <div class="flex justify-end">
      <img src="logo.jpg" class="h-8" alt="Company Logo">
    </div>
  </div>
</header>

<main class="p-4 max-w-3xl mx-auto space-y-6">
  <h2 class="text-lg font-semibold">Income Overview (Ongoing Projects)</h2>
  <div id="incomeContainer" class="space-y-4"></div>
</main>

<!-- Floating Add Income -->
<a href="income-add.html"
   class="fixed bottom-24 right-4 bg-green-600 text-white w-16 h-16 rounded-full flex items-center justify-center shadow-lg text-3xl hover:bg-green-700 transition-all">+</a>

<!-- Bottom Tabs -->
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t shadow">
  <div class="grid grid-cols-5 text-xs text-gray-600">
    <a href="index.html" class="py-3 flex flex-col items-center">🏠<span>Home</span></a>
    <a href="income.html" class="py-3 flex flex-col items-center text-green-600 font-medium">💰<span>Income</span></a>
    <a href="expense.html" class="py-3 flex flex-col items-center">💸<span>Expense</span></a>
    <a href="projects.html" class="py-3 flex flex-col items-center">🏗️<span>Project</span></a>
    <a href="reports.html" class="py-3 flex flex-col items-center">📊<span>Report</span></a>
  </div>
</nav>

<script>
  const supabase = window.supabase.createClient(
    'https://sbqyxvxpeqipcuavryhb.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNicXl4dnhwZXFpcGN1YXZyeWhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxNTk0NjcsImV4cCI6MjA4NDczNTQ2N30.XWbqg5fwC3TDFt-G79H-SGg-9WMdV08qkZ6OzdPK8f8'
  );

  async function loadIncome() {
    try {
      const { data: projects, error: projectsError } = await supabase
        .from('projects')
        .select('id, name')
        .eq('status', 'Ongoing');
      if (projectsError) throw projectsError;

      const container = document.getElementById('incomeContainer');
      container.innerHTML = '';

          for (let proj of projects) {
            const { data: incomeEntries, error: incomeError } = await supabase
              .from('income')
              .select('*')
              .eq('project_id', proj.id)
              .order('date', { ascending: false });
            if (incomeError) continue;
            if (!incomeEntries || incomeEntries.length === 0) continue;

            const projectDiv = document.createElement('div');
            projectDiv.className = "income-card bg-white";

            projectDiv.innerHTML = `
              <div class="income-header text-white px-4 py-3">
                <div class="flex items-center justify-between">
                  <div>
                    <div class="font-semibold">${proj.name}</div>
                    <div class="text-xs opacity-90">No.: ${proj.id}</div>
                  </div>
                  <div class="text-xs income-sub">Recent ${incomeEntries.length} entries</div>
                </div>
              </div>
              <div class="p-3 bg-white">
                <div class="space-y-1">
                  ${incomeEntries.map(e=>`
                    <div class="income-row hover:bg-green-50 rounded">
                      <div class="flex items-center gap-3">
                          <div class="income-date">${new Date(e.date).toLocaleDateString('en-US',{day:'numeric', month:'short', year:"numeric"})}</div>
                          <div class="income-meta">Gross: ${Number(e.gross_amount||0).toLocaleString()}</div>
                      </div>
                      <div class="flex items-center">
                        <div class="income-amount"> ${Number(e.received_amount||0).toLocaleString()}</div>
                        <div class="chev">▾</div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `;

            container.appendChild(projectDiv);

            // After appending, attach toggleable detail rows for small screens
            (function attachDetails(){
              const rows = projectDiv.querySelectorAll('.income-row');
              // create detail divs corresponding to each row (same order)
                rows.forEach((row, idx) => {
                const entry = incomeEntries[idx];
                const detail = document.createElement('div');
                detail.className = 'income-detail px-3 py-2 text-sm text-gray-600 bg-gray-50 rounded mt-1';
                detail.style.display = 'none';
                detail.innerHTML = `
                  <div>VAT:  ${entry.vat || 0}</div>
                  <div>Tax: ${entry.tax || 0}</div>
                  <div>Retention: ${entry.retention || 0}</div>
                `;
                row.insertAdjacentElement('afterend', detail);
                row.addEventListener('click', ()=>{
                  const shown = detail.style.display === 'block';
                  detail.style.display = shown ? 'none' : 'block';
                  row.classList.toggle('show-details', !shown);
                });
              });
            })();
          }

    } catch (err) {
      console.error('Error loading income:', err);
    }
  }

  loadIncome();
</script>

</body>
</html>
