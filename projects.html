<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body class="bg-gray-100">

<!-- Header -->
<header class="bg-white shadow px-4 py-3 flex justify-between items-center sticky top-0 z-20">
  <button id="menu-btn" class="text-slate-700 text-xl md:text-2xl font-semibold">☰</button>
  <h1 class="text-lg md:text-2xl font-semibold tracking-tight">M/S S.R. Suppliers</h1>
  <img src="logo.jpg" alt="Company Logo" class="h-9 w-auto">
</header>

<!-- Sidebar overlay -->
<div id="sidebar-overlay" class="fixed inset-0 hidden z-30" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<aside id="sidebar" class="fixed top-0 left-0 w-64 bg-blue-900 text-white h-full transform -translate-x-full transition-transform z-40">
  <div class="p-6 text-xl font-bold border-b border-blue-800 flex justify-between items-center">
    Menu
    <button onclick="toggleSidebar()" class="text-white text-lg font-bold">×</button>
  </div>
  <nav class="mt-6 space-y-1">
    <a href="index.html" class="block px-6 py-3 hover:bg-blue-800 rounded bg-blue-800">🏠 Dashboard</a>
    <a href="projects.html" class="block px-6 py-3 hover:bg-blue-800 rounded mt-1">🏗️ Projects</a>
    <a href="project-add.html" class="block px-6 py-3 hover:bg-blue-800 rounded mt-1">➕ Add Project</a>
    <a href="modify.html" class="block px-6 py-3 hover:bg-blue-800 rounded mt-1">✏️ Modify Page</a>
    <a href="income.html" class="block px-6 py-3 hover:bg-blue-800 rounded mt-1">💰 Income</a>
    <a href="income-add.html" class="block px-6 py-3 hover:bg-blue-800 rounded mt-1">➕ Add Income</a>
    <a href="expense.html" class="block px-6 py-3 hover:bg-blue-800 rounded mt-1">💸 Expense</a>
    <a href="expense-add.html" class="block px-6 py-3 hover:bg-blue-800 rounded mt-1">➕ Add Expense</a>
    <a href="reports.html" class="block px-6 py-3 hover:bg-blue-800 rounded mt-1">📊 Reports</a>
  </nav>
</aside>

<main id="main" class="p-6 space-y-6 max-w-4xl mx-auto">

  <!-- Ongoing Projects -->
  <section>
    <h2 class="text-lg font-bold mt-4 mb-2">Ongoing Projects</h2>
    <div id="ongoingProjects" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </section>

  <!-- Completed Projects -->
  <section>
    <h2 class="text-lg font-bold mt-6 mb-2">Completed Projects</h2>
    <div id="completedProjects" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </section>

</main>

<!-- Floating Add Project -->
<a href="project-add.html"
   class="fixed bottom-24 right-4 bg-blue-600 text-white w-16 h-16 rounded-full flex items-center justify-center shadow-lg text-3xl hover:bg-blue-700 transition-all">+</a>

<!-- Bottom Tabs -->
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t shadow">
  <div class="grid grid-cols-5 text-xs text-gray-600">
    <a href="index.html" class="py-3 flex flex-col items-center">🏠<span>Home</span></a>
    <a href="income.html" class="py-3 flex flex-col items-center">💰<span>Income</span></a>
    <a href="expense.html" class="py-3 flex flex-col items-center">💸<span>Expense</span></a>
    <a href="projects.html" class="py-3 flex flex-col items-center text-blue-600 font-medium">🏗️<span>Project</span></a>
    <a href="reports.html" class="py-3 flex flex-col items-center">📊<span>Report</span></a>
  </div>
</nav>

<!-- Projects JS -->
<script>
  
  const SUPABASE_URL = 'https://sbqyxvxpeqipcuavryhb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNicXl4dnhwZXFpcGN1YXZyeWhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxNTk0NjcsImV4cCI6MjA4NDczNTQ2N30.XWbqg5fwC3TDFt-G79H-SGg-9WMdV08qkZ6OzdPK8f8';
  const sup = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  
  async function loadProjects() {
    try {
      // --- Ongoing Projects ---
      const { data: ongoing, error: ongoingError } = await sup
        .from('projects')
        .select('*')
        .eq('status', 'Ongoing')
        .order('start_date', { ascending: true });
      if (ongoingError) throw ongoingError;

      const ongoingContainer = document.getElementById('ongoingProjects');
      ongoingContainer.innerHTML = '';
      ongoing.forEach(p => {
        const card = document.createElement('div');
        card.className = "bg-blue-50 border-l-4 border-blue-600 p-4 rounded-xl shadow cursor-pointer hover:shadow-lg hover:bg-blue-100 transition-all";
        card.innerHTML = `
          <h3 class="font-semibold text-blue-800">${p.name}</h3>
          <p class="text-sm text-gray-600">Expected Completion: ${p.expected_completion || '-'}</p>
          <p class="text-sm text-gray-600">Advance Payment: ৳ ${p.advance_payment || 0}</p>
        `;
        card.addEventListener('click', () => {
          window.location.href = `project.html?id=${p.id}`;
        });
        ongoingContainer.appendChild(card);
      });

      // --- Completed Projects ---
      const { data: completed, error: completedError } = await sup
        .from('projects')
        .select('*')
        .eq('status', 'Completed')
        .order('actual_completion', { ascending: true });
      if (completedError) throw completedError;

      const completedContainer = document.getElementById('completedProjects');
      completedContainer.innerHTML = '';
      completed.forEach(p => {
        const card = document.createElement('div');
        card.className = "bg-green-50 border-l-4 border-green-600 p-4 rounded-xl shadow cursor-pointer hover:shadow-lg hover:bg-green-100 transition-all";
        card.innerHTML = `
          <h3 class="font-semibold text-green-800">${p.name}</h3>
          <p class="text-sm text-gray-600">Actual Completion: ${p.actual_completion || '-'}</p>
          <p class="text-sm text-gray-600">Advance Payment: ৳ ${p.advance_payment || 0}</p>
        `;
        card.addEventListener('click', () => {
          window.location.href = `project.html?id=${p.id}`;
        });
        completedContainer.appendChild(card);
      });

    } catch (err) {
      console.error('Error loading projects:', err);
    }
  }

  // Load projects on page load
  loadProjects();

  // Sidebar toggle
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const menuBtn = document.getElementById('menu-btn');
  function toggleSidebar(){ sidebar.classList.toggle('-translate-x-full'); overlay.classList.toggle('hidden'); }
  menuBtn.addEventListener('click', toggleSidebar);
</script>

</body>
</html>
